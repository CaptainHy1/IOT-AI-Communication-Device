<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BE Test - Mic → Server → Loa</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
      .wrap { max-width: 820px; margin: 0 auto; }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      button { padding: 10px 14px; font-size: 14px; cursor: pointer; }
      button[disabled] { opacity: .6; cursor: not-allowed; }
      .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #eee; }
      pre { background: #0b1020; color: #cfe0ff; padding: 12px; border-radius: 10px; overflow: auto; }
      .muted { color: #555; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h2>BE Test: Bấm nói → server xử lý → phát ra loa</h2>
      <div class="row">
        <button id="btnConnect">Connect</button>
        <button id="btnToggle" disabled>Bắt đầu nói</button>
        <span id="status" class="pill">disconnected</span>
        <span class="muted">PCM16 mono 16kHz qua WebSocket</span>
      </div>

      <h3>Log</h3>
      <pre id="log"></pre>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
